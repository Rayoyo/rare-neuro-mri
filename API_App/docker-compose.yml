services:
  api:
    build: .
    image: ghcr.io/rayoyo/rare-neuro-mri-api:latest
    container_name: rare-neuro-mri-api
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
      DEVICE: cpu
      IMG_SIZE: 224
      MAX_UPLOAD_MB: 15
      # set to "false" only for debugging: it disables the out-of-distribution check
      ENABLE_REJECTION: ${ENABLE_REJECTION:-true}
    volumes:
      # Read-only: the API must never write into the model store
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s